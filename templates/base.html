<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Made by Nhi Le{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='favicon.jpg') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">

            <!-- Logo -->
            <a href="{{ url_for('home') }}" class="logo">
                <img
                    src="{{ url_for('static', filename='logo.jpg') }}"
                    alt="Made by Nhi Le logo"
                    class="logo-image"
                >

                <span class="logo-text">Made by Nhi Le</span>
            </a>


            <!-- Mobile Menu Button -->
            <button
                class="menu-toggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="main-navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <!-- Navigation -->
            <ul class="nav-links" id="main-navigation">

                <li>
                    <a
                        href="{{ url_for('home') }}"
                        class="{% if request.endpoint == 'home' %}active{% endif %}"
                    >
                        Home
                    </a>
                </li>

                <li>
                    <a
                        href="{{ url_for('about') }}"
                        class="{% if request.endpoint == 'about' %}active{% endif %}"
                    >
                        About
                    </a>
                </li>

                <li>
                    <a
                        href="{{ url_for('gallery') }}"
                        class="{% if request.endpoint == 'gallery' %}active{% endif %}"
                    >
                        Gallery
                    </a>
                </li>

                <li>
                    <a
                        href="{{ url_for('contact') }}"
                        class="{% if request.endpoint == 'contact' %}active{% endif %}"
                    >
                        Contact Me
                    </a>
                </li>

            </ul>

        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Made by Nhi Le</p>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const menuToggle = document.querySelector(".menu-toggle");
            const navigation = document.querySelector(".nav-links");
            const navigationLinks = document.querySelectorAll(".nav-links a");

            if (!menuToggle || !navigation) {
                return;
            }

            // Open and close mobile navigation
            menuToggle.addEventListener("click", function () {
                const menuIsOpen = navigation.classList.toggle("open");

                menuToggle.classList.toggle("open", menuIsOpen);
                menuToggle.setAttribute(
                    "aria-expanded",
                    menuIsOpen ? "true" : "false"
                );
            });

            // Close menu when a navigation link is clicked
            navigationLinks.forEach(function (link) {
                link.addEventListener("click", function () {
                    navigation.classList.remove("open");
                    menuToggle.classList.remove("open");
                    menuToggle.setAttribute("aria-expanded", "false");
                });
            });

        });
    </script>
</body>
</html>
