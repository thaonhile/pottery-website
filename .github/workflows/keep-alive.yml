name: Keep Website Awake 2

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://madebynhile.com/)
          echo "HTTP Status: $STATUS"